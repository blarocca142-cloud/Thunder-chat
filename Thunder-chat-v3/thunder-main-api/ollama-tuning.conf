# systemd drop-in for ollama.service. Install with:
#
#     sudo cp ollama-tuning.conf /etc/systemd/system/ollama.service.d/tuning.conf
#     sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Drop-in only. override.conf still supplies OLLAMA_KEEP_ALIVE=-1 and
# OLLAMA_HOST=0.0.0.0:11434; systemd appends Environment= across drop-ins
# rather than replacing, so both survive. User=ollama (uid 997) is untouched -
# the iptables egress lockdown in net-lockdown/lock.sh keys on that uid and
# would silently stop applying if the service ever changed user.
#
# Measured expectations before installing this (2026-09-29, see
# reports/ollama-tuning-2026-09-29.md) - neither of these is a speed win:
#
#   OLLAMA_FLASH_ATTENTION=1  Flash attention was ALREADY ON. Ollama 0.33.3
#       launches the runner with `--flash-attn auto` and the logs show
#       "resolve_fused_ops: Flash Attention enabled" on every single load. This
#       forces on what auto already chose; it does not turn anything new on.
#
#   OLLAMA_KV_CACHE_TYPE=q8_0  gpt-oss 20B uses sliding-window attention with
#       only 12 KV layers at head dim 64, so its whole KV cache at 16384 ctx is
#       414 MiB (384 non-SWA + 30 SWA). Halving that saves ~200 MiB of 24576.
#       Worth having, but it buys context headroom, not tokens per second, and
#       quantised KV can cost a little quality.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
