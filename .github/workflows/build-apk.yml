name: Build Thunder APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Thunder-chat-v3/thunder-android/**"
      - ".github/workflows/build-apk.yml"
  push:
    branches: [main]
    paths:
      - "Thunder-chat-v3/thunder-android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Thunder-chat-v3/thunder-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch official gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L --fail -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # Without a fixed key, every runner generates its own debug keystore, so
      # each build is signed differently and Android refuses to install one
      # over another - which also makes the in-app updater impossible. If the
      # secret is present we reuse one key forever; if not, the build still
      # works exactly as before, just uninstall-first.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            # app/debug.keystore, not ~/.android - the runner can redirect AGP's
            # default lookup via ANDROID_SDK_HOME, so build.gradle.kts points at
            # this path explicitly.
            echo "$KEYSTORE_B64" | base64 -d > app/debug.keystore
            if ! keytool -list -keystore app/debug.keystore -storepass android >/dev/null 2>&1; then
              echo "::error::ANDROID_DEBUG_KEYSTORE_B64 is set but did not decode into a readable keystore."
              exit 1
            fi
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Using the repository's fixed debug key:"
            keytool -list -v -keystore app/debug.keystore -storepass android \
              | grep -i "SHA256:" | head -1
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_B64 secret set - this build gets a throwaway key, so it cannot install over an existing Thunder and the in-app updater will not work."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report signing fingerprint
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          # These APKs are v2-signed only, which keytool -printcert cannot read
          # - it looks for a v1 JAR signature and silently prints nothing.
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1
          else
            echo "apksigner not found - skipping fingerprint"
          fi
          echo "stable key: ${{ steps.signing.outputs.stable }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thunder-debug-apk
          path: Thunder-chat-v3/thunder-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # The release below is the copy that matters - it is what /app/version
          # resolves and what the phone downloads. This artifact is only useful
          # for grabbing a build straight off a run, which is worth days rather
          # than the 90-day default: 58 of them had accumulated to 1GB before
          # anyone noticed, and they are regenerated by the next push anyway.
          retention-days: 7

      # Actions artifacts need authentication to download, so they cannot back
      # the in-app updater. A release gives a public, stable URL:
      #   .../releases/latest/download/thunder.apk
      # The asset name is deliberately version-free so that URL never changes.
      - name: Publish release for in-app updater
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "could not read versionName"; exit 1; fi
          cp app/build/outputs/apk/debug/app-debug.apk thunder.apk
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" thunder.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" thunder.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Thunder $VERSION" \
              --notes "Debug build of Thunder $VERSION, installed by the app's own updater.

          Commit: $GITHUB_SHA"
          fi
          echo "Published v$VERSION"
