name: Build Thunder APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Thunder-chat-v3/thunder-android/**"
      - ".github/workflows/build-apk.yml"
  push:
    branches: [main]
    paths:
      - "Thunder-chat-v3/thunder-android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Thunder-chat-v3/thunder-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch official gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L --fail -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thunder-debug-apk
          path: Thunder-chat-v3/thunder-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
