name: Release Thunder APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch official gradle-wrapper.jar
        working-directory: Thunder-chat-v3/thunder-android
        run: |
          mkdir -p gradle/wrapper
          curl -L --fail -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        working-directory: Thunder-chat-v3/thunder-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="Thunder-chat-v3/thunder-android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="Thunder-${GITHUB_REF_NAME}-debug.apk"
          test -f "$SRC"
          cp "$SRC" "$OUT"
          NOTES="$(mktemp)"
          {
            echo "Sideload this debug APK over the existing Thunder app (allow unknown sources)."
            echo
            echo "Cartoon Thunder launcher with the silver-gray eye patch, plus the toy-play thinking loop."
            echo
            echo "Direct phone download (no GitHub login):"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${OUT}"
          } > "$NOTES"
          gh release create "${GITHUB_REF_NAME}" "$OUT" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Thunder ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES"
